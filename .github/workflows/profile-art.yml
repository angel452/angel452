name: update profile art

# Regenerates the daily SVGs shown in the profile README:
#   images/breakout-{light,dark}.svg  breakout game from the contribution graph
#   images/stats.svg                  streak / contributions card
# images/portrait.svg is static: rebuild it locally with
# `uv run scripts/portrait.py` when Avatar.png changes.

on:
  schedule:
    - cron: "17 6 * * *" # once a day, ~06:17 UTC
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate breakout SVGs
        uses: cyprieng/github-breakout@v1.0.0
        with:
          github_username: ${{ github.repository_owner }}

      - name: Move breakout SVGs
        run: |
          mkdir -p images
          mv output/light.svg images/breakout-light.svg
          mv output/dark.svg images/breakout-dark.svg

      - name: Render stats card
        env:
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/stats.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/breakout-light.svg images/breakout-dark.svg images/stats.svg
          git commit -m "chore: update profile art" || echo "No changes to commit"
          git push
